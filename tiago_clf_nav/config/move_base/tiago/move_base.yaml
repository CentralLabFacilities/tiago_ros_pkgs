#move base
#actionlib_status_frequency: 0.0 # frequency at which status of action server is published on topic

planner_frequency: 0.1
planner_patience : 0.5

controller_frequency: 20.0
controller_patience :  0.2

oscillation_timeout : 10.0
oscillation_distance:  0.2

recovery_behavior_enabled: true
shutdown_costmaps        : false

search_alternative_goals: true
alternative_goals_thresh: 0.5

#recovery
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery} # biron
  - {name: aggressive_reset, type: clear_costmap_recovery/ClearCostmapRecovery}

aggressive_reset:
  reset_distance: 0.0
  layer_names: ["global_obstacle_layer","global_rgbd_obstacle_layer","obstacle_sonar_layer", "obstacle_layer", "obstacle_sonar_layer", "rgbd_obstacle_layer","inflation_layer"]

conservative_reset:
  layer_names: ["global_obstacle_layer", "global_rgbd_obstacle_layer"]
  reset_distance: 5.0

clearing_rotation_allowed: false #defualt: true with false: avoid the dreaded rosroll?

